name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check generated language tables
        run: python3 scripts/generate-localizations.py --check
      - name: Public source boundary
        run: python3 scripts/audit-public-tree.py
      - name: Scan full public history for secrets
        run: python3 scripts/scan-secrets.py
